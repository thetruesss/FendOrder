services:
  api:
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    volumes:
      - sessions:/app/.sessions
    # Gecko allocates large shared-memory segments; Docker's 64 MB default
    # makes pages crash intermittently under load.
    shm_size: "1gb"
    restart: unless-stopped

  worker:
    build: .
    env_file: [.env]
    command: celery -A ozon_anti_bot_engine.tasks worker --loglevel=info --concurrency=2
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    volumes:
      - sessions:/app/.sessions
    shm_size: "1gb"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ozon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ozon}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ozon}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sessions:
  redis-data:
  pg-data:
