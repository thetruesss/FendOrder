[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-anti-bot-engine"
version = "2.0.0"
description = "Enterprise B2B Ozon anti-bot engine and seller analytics platform"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
ozon-engine = "ozon_anti_bot_engine.main:run"

[tool.setuptools.packages.find]
include = ["ozon_anti_bot_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic
